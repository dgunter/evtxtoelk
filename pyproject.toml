[project]
name = "evtxtoelk"
version = "2.1.0"
description = "Load Windows Event Log (.evtx) files into Elasticsearch."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Dan Gunter" }]
requires-python = ">=3.10"
keywords = ["evtx", "elasticsearch", "windows", "event log", "dfir"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "python-evtx>=0.8.1",
    "elasticsearch>=9.0,<10",
    "xmltodict>=1.0",
]

[project.urls]
Homepage = "https://github.com/dgunter/evtxtoelk"
Issues = "https://github.com/dgunter/evtxtoelk/issues"

[project.scripts]
evtxtoelk = "evtxtoelk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "evtxtoelk",
    "tests",
    "scripts",
    "docker-compose.yml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE.txt",
    "pyproject.toml",
]
exclude = ["tests/data/*.evtx"]

[tool.hatch.build.targets.wheel]
packages = ["evtxtoelk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Elasticsearch (see docker-compose.yml)",
    "samples: needs the EVTX-ATTACK-SAMPLES corpus (see tests/test_attack_samples.py)",
]
addopts = "-m 'not integration and not samples'"

[tool.coverage.run]
source = ["evtxtoelk"]
branch = true
# Exercised via subprocess in tests/test_main_module.py; not visible to in-process coverage.
omit = ["evtxtoelk/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored verbatim from DetectionBench; keep it byte-identical rather than lint it here.
# Markdown is documentation; its code fences are not held to the formatter.
extend-exclude = [".github/scripts", ".cache", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
